<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial
scale=1">
    <title>Contact Us</title>
    <link rel="stylesheet" th:href="@{/css/contact.css}">
    <link href=https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/boot strap.min.css rel="stylesheet">
</head>

<body>
    <div class="container">
        <div class="contact-card">
            <h2 class="mb-4 text-center">Contact Us</h2>
            <!-- Success Message -->
            <div th:if="${successMessage}" class="alert alert-success">
                <span th:text="${successMessage}"></span>
            </div>
            <!-- Error Message -->
            <div th:if="${errorMessage}" class="alert alert-danger">
                <span th:text="${errorMessage}"></span>
            </div>
            <form th:action="@{/contact}" th:object="${contactDto}" method="post" id="contactForm">
                <!-- Name -->
                <div class="form-group">
                    <label>Name *</label>
                    <input type="text" class="form-control" th:field="*{name}" placeholder="Enter your name">
                    <div class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">
                    </div>
                </div>
                <!-- Email -->
                <div class="form-group">
                    <label>Email *</label>
                    <input type="email" class="form-control" th:field="*{email}" placeholder="Enter your email">
                    <div class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">
                    </div>
                </div>
                <!-- Phone -->
                <div class="form-group">
                    <label>Phone Number *</label>
                    <input type="text" class="form-control" th:field="*{phone}" placeholder="10-digit mobile number starting with 69">
                    <div class="text-danger" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}">
                    </div>
                </div>
                <!-- Subject -->
                <div class="form-group">
                    <label>Subject *</label>
                    <input type="text" class="form-control" th:field="*{subject}" placeholder="Enter subject">
                    <div class="text-danger" th:if="${#fields.hasErrors('subject')}" th:errors="*{subject}">
                    </div>

                </div>
                <!-- Message -->
                <div class="form-group">
                    <label>Message *</label>
                    <textarea rows="6" class="form-control" th:field="*{message}" placeholder="Write your message here">
                </textarea>
                    <div class="text-danger" th:if="${#fields.hasErrors('message')}" th:errors="*{message}">
                    </div>
                </div>
                <!-- Submit Button -->
                <button id="submitBtn" class="btn btn-primary w-100" type="submit">

                    Submit Enquiry
                </button>
            </form>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById("contactForm").addEventListener("submit", function () {
            const button = document.getElementById("submitBtn");
            button.disabled = true;
            button.innerHTML = "Submitting...";
        }); 
    </script>
</body>

</html>
